<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Дневник калорий{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <nav class="container">
    <ul><li><a href="{% url 'web:today' %}"><strong>Калории</strong></a></li></ul>
    <ul>
      {% if user.is_authenticated %}
        <li><a href="{% url 'web:profile' %}">Профиль</a></li>
        <li>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="outline">Выйти</button>
          </form>
        </li>
      {% endif %}
    </ul>
  </nav>

  <main class="container">
    {% if messages %}
      {% for message in messages %}<article>{{ message }}</article>{% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

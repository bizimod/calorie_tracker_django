{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Дневник калорий{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header class="topbar">
    <a class="brand" href="{% url 'web:today' %}">
      <span class="logo">◐</span>
      <span>
        <strong>Калории</strong>
        <small>дневник питания</small>
      </span>
    </a>
    <nav class="user">
      {% if user.is_authenticated %}
        <a href="{% url 'web:profile' %}">Профиль</a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="ghost" type="submit">Выйти</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Войти</a>
      {% endif %}
    </nav>
  </header>

  <main class="page">
    {% if messages %}
      {% for message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script>
    document.addEventListener('click', function (event) {
      var node = event.target.closest('.clamp');
      if (node) node.classList.toggle('is-open');
    });
  </script>
</body>
</html>

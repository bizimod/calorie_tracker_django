{% for p in results %}
  <div class="search-row">
    <span>{{ p.name }}{% if p.brand %} · {{ p.brand }}{% endif %}</span>
    <small class="muted">{{ p.calories }} ккал/100г</small>
    {% if meal %}
      <form hx-post="{% url 'web:add-product' meal.id p.id %}"
            hx-target="#meal-{{ meal.meal_type }}" hx-swap="outerHTML">
        {% csrf_token %}
        <input type="number" name="weight_grams" value="100" min="1" step="1">
        <button type="submit">+</button>
      </form>
    {% endif %}
  </div>
{% empty %}
  {% if query %}
    <small class="muted">
      Ничего не найдено{% if query|length < 2 %} — введите минимум 2 символа{% endif %}
    </small>
  {% endif %}
{% endfor %}

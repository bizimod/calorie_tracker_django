{% extends 'web/base.html' %}
{% block content %}
<div class="auth">
  <h1>Вход</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="primary" type="submit">Войти</button>
  </form>
  <p class="muted">Нет аккаунта? <a href="{% url 'web:register' %}">Зарегистрироваться</a></p>
</div>
{% endblock %}
